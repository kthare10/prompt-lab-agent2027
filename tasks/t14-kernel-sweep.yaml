id: t14-kernel-sweep
title: A parameter sweep over a grid
tier: core
family: build
exposure: undocumented
exposure_evidence: >
  No hit for parameter sweep, grid search or itertools.product in PEGASUS.md, the
  Studio overlay, any SKILL.md, or any of the 13 shipped generators. Every example
  parameterises over *one* list — samples, plots, regions, stations — never a
  cross-product.
skill: pegasus-scaffold
agent: general
project: kernel-sweep
depth: plan

prompt: |
  Call it kernel-sweep.

  I want to try a smoothing model on my data across a range of settings and see
  which does best. Two knobs: a kernel width, and a regularisation strength. I'd
  like to try five values of each — so every combination — on each of my four
  datasets.

  Each combination is an independent fit. At the end I want one table ranking all
  the runs by cross-validation score, and the single best model saved.

sim_answers:
  values: "Kernel width 0.5 to 4 and regularisation 1e-4 to 1e0, both log-spaced. Put them in a config."
  datasets: "Four, and I'll add more later."
  ranking: "By mean CV score, best first. Ties broken by the simpler model."
  default: "Your call."

expect:
  files: [workflow_generator.py, README.md, run_manual.sh, bin/, config/]
  jobs: ">=100"
  dag: cross_product_fan_in
  must:
    - jobs enumerate the full grid (5 x 5 x 4 = 100 fits), generated by iteration
    - grid values come from config, not hardcoded in the DAG
    - each fit's output file name encodes its point in the grid, uniquely
    - a single ranking job consumes all fits; a selection step emits the best model
  must_not:
    - one job per dataset with the sweep hidden inside the wrapper
    - output filename collisions across grid points

rubric:
  - Is the cross-product in the DAG, or smuggled into a single job's inner loop?
    Both "work"; only one gives the scientist per-combination retry and provenance.
  - Are the 100 output LFNs unique and interpretable?
  - Does the grid stay editable without touching the DAG code?

inspired_by: nothing — every shipped example parameterises over a single list, so
  the cross-product is the smallest genuine step past the corpus.
